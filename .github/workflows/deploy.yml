name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the Pages deployment publish, and keep only one run at a time.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Data invariants, then types, then lint: cheapest signal first.
      - run: bun run validate
      - run: bun run typecheck
      - run: bun run lint

      # Pages serves a project site from /<repo>/, so the asset URLs need that
      # prefix. A user or org site (<account>.github.io) and a custom domain
      # both serve from the root instead. GITHUB_REPOSITORY is always set,
      # unlike the event payload, which varies by trigger.
      - name: Build
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          base="/$repo/"
          case "$repo" in *.github.io) base="/" ;; esac
          if [ -f public/CNAME ]; then base="/"; fi
          echo "Building with BASE_PATH=$base"
          BASE_PATH="$base" bun run vite build

      # Pages must already be switched on for the repository, under
      # Settings > Pages > Source: GitHub Actions. The `enablement` input cannot
      # do it here: creating a Pages site is not something GITHUB_TOKEN is
      # allowed to do, and it fails with "Resource not accessible by
      # integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
